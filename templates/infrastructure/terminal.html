{% extends "base.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/terminal.css' %}">
<style>
    /* Ensure the body takes full height for the terminal app feel */
    body {
        height: 100vh;
        overflow: hidden;
        background-color: oklch(var(--b2)); /* Match base-200 */
    }
    
    /* Custom scrollbar for the terminal window */
    .xterm-viewport::-webkit-scrollbar {
        width: 10px;
    }
    .xterm-viewport::-webkit-scrollbar-track {
        background: #1e1e1e;
    }
    .xterm-viewport::-webkit-scrollbar-thumb {
        background-color: #424242;
        border-radius: 4px;
    }
</style>
{% endblock %}

{% block body %}
<div class="h-full w-full flex flex-col p-4 gap-4 max-w-7xl mx-auto">

    <div class="flex justify-between items-center">
        <a href="{% url 'node' node.id %}" class="btn btn-sm btn-ghost gap-2 text-base-content/70 hover:text-base-content">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back to {{ node.hostname }}
        </a>
        
        <div class="flex items-center gap-2">
            <div class="badge badge-outline gap-2 font-mono text-xs">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-warning animate-pulse"></div>
                <span id="status-text">Connecting...</span>
            </div>
        </div>
    </div>

    <div class="mockup-window border border-base-300 bg-base-300 shadow-2xl flex-1 flex flex-col min-h-0">
        
        <div class="flex justify-center -mt-8 mb-2">
            <span class="font-mono text-sm text-base-content/50">
                ssh {{ node.username }}@{{ node.hostname }} ({{ node.ip_address }})
            </span>
        </div>

        <div class="flex-1 bg-[#1e1e1e] p-2 relative">
            <div id="terminal" class="w-full h-full"></div>
        </div>
    </div>
    
    <div class="text-center text-xs text-base-content/30 pb-2">
        Powered by NIA-OS Secure Gateway
    </div>
</div>

<script src="{% static 'js/xterm.js' %}"></script> <script src="{% static 'js/xterm-addon-fit.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // UI References
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // 1. Initialize xterm.js
    const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "Menlo, Monaco, 'Courier New', monospace",
        theme: {
            background: "#1e1e1e",
            foreground: "#d4d4d4",
            cursor: "#42A5F5",
            selectionBackground: "rgba(66, 165, 245, 0.3)"
        },
        disableStdin: false, // Initially enabled, we disable if connection fails
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    const terminalDiv = document.getElementById("terminal");
    term.open(terminalDiv);
    fitAddon.fit();

    // 2. Setup WebSocket
    const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
    const socketUrl = protocol + window.location.host + `/ws/infrastructure/nodes/{{ node.id }}/terminal/`;
    const socket = new WebSocket(socketUrl);

    // 3. Bind Events
    term.onData(data => {
        if (socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ "data": data }));
        }
    });

    socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.output) {
            term.write(msg.output);
        }
    };

    socket.onopen = () => {
        // Update UI
        statusDot.classList.remove('bg-warning');
        statusDot.classList.add('bg-success');
        statusText.textContent = "Connected";
        
        term.write(`\r\n\x1b[32m[NIA-OS] Secure channel established to {{ node.hostname }}.\x1b[0m\r\n`);
        term.focus();

        socket.send(JSON.stringify({ 
            "resize": {
                "cols": term.cols,
                "rows": term.rows
            } 
        }));
    };

    socket.onclose = () => {
        statusDot.classList.remove('bg-success');
        statusDot.classList.add('bg-error');
        statusText.textContent = "Disconnected";
        
        term.options.cursorBlink = false;
        term.write(`\r\n\x1b[33m[NIA-OS] Session ended. Redirecting in 2s...\x1b[0m\r\n`);

        setTimeout(() => {
            window.location.href = "{% url 'node' node.id %}"; 
        }, 2000);
    };

    socket.onerror = (e) => {
        statusDot.classList.remove('bg-warning');
        statusDot.classList.add('bg-error');
        statusText.textContent = "Error";
        term.write(`\r\n\x1b[31m[NIA-OS] Connection Error.\x1b[0m\r\n`);
    };

    // 4. Handle Window Resize
    let resizeTimeout;
    window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            fitAddon.fit();
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ 
                    "resize": {
                        "cols": term.cols,
                        "rows": term.rows
                    } 
                }));
            }
        }, 200);
    });
});
</script>
{% endblock %}
