[project]
name = "nia-os"
version = "1.0.0"
description = "Network Infrastructure Automation & Orchestration System"
requires-python = ">=3.14"
readme = "readme.md"
license = "license.md"
dependencies = [
    "asyncssh>=2.22.0",
    "channels[daphne,types]>=4.3.2",
    "django>=6.0",
    "django-allauth[socialaccount]>=65.13.1",
    "django-environ>=0.12.0",
    "django-fernet-encrypted-fields>=0.3.1",
    "django-htmx>=1.27.0",
    "django-q2>=1.9.0",
    "django-tailwind-cli>=4.4.2",
    "django-unfold>=0.74.1",
    "django-widget-tweaks>=1.5.0",
    "lucide[django]>=1.1.3",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
    "ruff>=0.14.10",
]
