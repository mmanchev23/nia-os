name: Continuous Integration

on:
  push:
    branches: &branches
      - main
    paths-ignore: &ignored-paths
      - "k8s/**"
      - "docs/**"
      - "scripts/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: *branches
    paths-ignore: *ignored-paths

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff Lint
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format . --check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -n auto

  check-deploy:
    name: Check Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run deployment checks
        run: uv run python manage.py check --deploy

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, check-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Generate Image Metadata
        id: meta
        run: |
          TS=$(date +%s)

          FULL_TAG="latest-${TS}"
          echo "FULL_TAG=${FULL_TAG}" >> $GITHUB_ENV

          IMAGE_URL="ghcr.io/${{ github.repository }}"
          echo "IMAGE_URL=${IMAGE_URL}" >> $GITHUB_ENV

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_URL }}:${{ env.FULL_TAG }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete Old Package Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: "container"
          min-versions-to-keep: 3
          delete-only-untagged-versions: "false"
          token: ${{ secrets.PAT }}
